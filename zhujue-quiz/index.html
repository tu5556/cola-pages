<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="你是《主角》里的谁？">
  <meta property="og:description" content="20道题，测测你离忆秦娥有多近">
  <meta property="og:image" content="assets/images/og-cover.jpg">
  <title>《主角》你是剧里的谁？</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/images/og-cover.jpg">
</head>
<body>

  <!-- BGM Audio -->
  <audio id="bgm" loop preload="auto" src="assets/audio/bgm-home.mp3"></audio>

  <!-- Audio Toggle -->
  <div id="audio-toggle">🔊</div>

  <!-- Share Overlay -->
  <div id="share-overlay">
    <img id="share-img" src="" alt="分享卡片">
    <div class="share-hint">长按图片保存到相册</div>
    <div class="share-close" id="share-close">关闭</div>
  </div>

  <!-- Page: Loading -->
  <div class="page active" id="page-loading">
    <div class="loading-text">板胡一起，戏就开了…</div>
  </div>

  <!-- Page: Home -->
  <div class="page" id="page-home">
    <video id="home-video" src="assets/video/hero-home.mp4" playsinline loop preload="auto"></video>
    <div class="home-overlay"></div>
    <div class="home-content">
      <div class="home-title">你是《主角》里的谁？</div>
      <div class="home-sub">20 道题，测测你离忆秦娥有多近</div>
      <div class="home-quote">「苦啊」</div>
      <button class="btn-start" id="btn-start">开始答题</button>
    </div>
  </div>

  <!-- Page: Quiz -->
  <div class="page" id="page-quiz">
    <div class="quiz-container">
      <div class="quiz-progress">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <div class="progress-num" id="progress-num">0/20</div>
      </div>
      <div class="quiz-card" id="quiz-card"></div>
    </div>
  </div>

  <!-- Page: Result -->
  <div class="page" id="page-result">
    <div class="result-content">
      <div class="result-title" id="result-title"></div>
      <div class="result-score" id="result-score"></div>
      <div class="result-desc" id="result-desc"></div>
      <button class="btn-share" id="btn-share">📸 生成分享卡片</button>
      <div class="btn-retry" id="btn-retry">再测一次</div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/quiz-data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/share.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
